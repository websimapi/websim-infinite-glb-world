<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite GLB World</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background-color: #111;
            color: white;
        }
        canvas {
            display: block;
        }
        #info-container {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            z-index: 100;
        }
        #info-container input {
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="info-container">
        <div>Upload your GLB character</div>
        <input type="file" id="glb-upload" accept=".glb">
        <div>Use WASD to move, Mouse to look.</div>
    </div>
    <canvas id="c"></canvas>

    <script type="importmap">
    {
        "imports": {

            "three/addons/": "https://esm.sh/three/examples/jsm/"

    </script>
